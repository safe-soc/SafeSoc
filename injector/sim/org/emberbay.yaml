# SafeSOC network simulator: company definition (data only).
#
# EmberBay Financial Services is FICTIONAL. Every host, user, address and
# account below is invented for the simulator, except the attacker IPs,
# which are real, publicly reported addresses (see the `attackers` notes).
# Public company addresses use the RFC 5737 documentation range
# 203.0.113.0/24, and the AWS access key is AWS's own documentation example.
#
# Loaded and validated by injector/sim/org.py: `python -m injector.sim org`.

company:
  name: EmberBay Financial Services
  fictional: true
  domain: emberbay.local
  netbios_domain: EMBERBAY
  # Fictional AD domain SID. User SIDs are <domain_sid>-<rid>; well-known
  # domain groups use their standard RIDs (Domain Admins = 512).
  domain_sid: S-1-5-21-3623811015-3361044348-30300820
  timezone: Asia/Kolkata

public_ips:
  edge_wan: 203.0.113.10   # EB-FW01 WAN interface
  web01_nat: 203.0.113.20  # 1:1 NAT to EB-WEB01
  vpn01_nat: 203.0.113.21  # 1:1 NAT to EB-VPN01

zones:
  - name: edge
    vlan: null
    subnet: null
    purpose: pfSense EB-FW01 (firewall + Suricata IDS + NAT)
    monitored: true
  - name: users
    vlan: 10
    subnet: 10.10.10.0/24
    purpose: Staff workstations and developer machines
    monitored: true
  - name: servers
    vlan: 20
    subnet: 10.10.20.0/24
    purpose: Internal servers (AD, file shares, database)
    monitored: true
  - name: dmz
    vlan: 30
    subnet: 10.10.30.0/24
    purpose: Internet-facing services (web portal, VPN, mail)
    monitored: true
  - name: security
    vlan: 40
    subnet: 10.10.40.0/24
    purpose: Security tooling and log collectors (never an attack target)
    monitored: false

assets:
  # ── Edge ──────────────────────────────────────────
  - hostname: EB-FW01
    zone: edge
    ip: 10.10.40.1            # LAN side; WAN is public_ips.edge_wan
    os: pfSense
    os_version: "2.7"
    role: firewall/ids
    services: [filterlog, suricata, nat]
    wazuh_agent_id: "007"     # Wazuh agent (FreeBSD package) reading filter.log and eve.json

  # ── Users (Windows 11 23H2) ───────────────────────
  - {hostname: EB-FIN-WS05, zone: users, ip: 10.10.10.21, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "010", primary_user: arjun.mehta}
  - {hostname: EB-FIN-WS06, zone: users, ip: 10.10.10.22, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "011", primary_user: priya.nair}
  - {hostname: EB-FIN-WS07, zone: users, ip: 10.10.10.23, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "012", primary_user: neha.sharma}
  - {hostname: EB-HR-WS01, zone: users, ip: 10.10.10.24, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "013", primary_user: kavya.rao}
  - {hostname: EB-HR-WS02, zone: users, ip: 10.10.10.25, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "014", primary_user: rohan.das}
  - {hostname: EB-IT-WS01, zone: users, ip: 10.10.10.26, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "015", primary_user: adm.rahul}
  - {hostname: EB-IT-WS02, zone: users, ip: 10.10.10.27, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "016", primary_user: sneha.kulkarni}
  - {hostname: EB-SAL-WS01, zone: users, ip: 10.10.10.28, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "017", primary_user: vikram.singh}
  - {hostname: EB-SAL-WS02, zone: users, ip: 10.10.10.29, os: Windows, os_version: 11 23H2, role: workstation, services: [], wazuh_agent_id: "018", primary_user: ananya.iyer}

  # ── Dev (Ubuntu 22.04) ────────────────────────────
  - {hostname: EB-DEV-LX01, zone: users, ip: 10.10.10.41, os: Ubuntu, os_version: "22.04", role: developer workstation, services: [sshd], wazuh_agent_id: "020", primary_user: karthik.reddy}
  - {hostname: EB-DEV-LX02, zone: users, ip: 10.10.10.42, os: Ubuntu, os_version: "22.04", role: developer workstation, services: [sshd], wazuh_agent_id: "021", primary_user: meera.joshi}

  # ── Servers ───────────────────────────────────────
  - hostname: EB-DC01
    zone: servers
    ip: 10.10.20.10
    os: Windows Server
    os_version: "2022"
    role: domain controller
    services: [AD DS, DNS]
    wazuh_agent_id: "001"
    owner: adm.rahul
  - hostname: EB-FS01
    zone: servers
    ip: 10.10.20.20
    os: Windows Server
    os_version: "2022"
    role: file server
    services: [SMB]
    shares: ['\\EB-FS01\Finance', '\\EB-FS01\HR', '\\EB-FS01\Shared']
    wazuh_agent_id: "002"
    owner: adm.rahul
  - hostname: EB-DB01
    zone: servers
    ip: 10.10.20.30
    os: Ubuntu
    os_version: "22.04"
    role: database server
    services: [PostgreSQL 15, sshd]
    databases: [finance_core]
    wazuh_agent_id: "003"
    owner: adm.rahul

  # ── DMZ ───────────────────────────────────────────
  - hostname: EB-WEB01
    zone: dmz
    ip: 10.10.30.10
    public_ip: 203.0.113.20
    os: Ubuntu
    os_version: "22.04"
    role: customer portal web server
    services: [nginx 1.24, customer portal app, sshd]
    web_paths: [/, /login, /admin, /api/*, /uploads/]
    wazuh_agent_id: "004"
    owner: karthik.reddy
  - hostname: EB-VPN01
    zone: dmz
    ip: 10.10.30.20
    public_ip: 203.0.113.21
    os: Ubuntu
    os_version: "22.04"
    role: remote-access VPN
    services: [OpenVPN 2.6 udp/1194]
    vpn_pool: 10.8.0.0/24
    wazuh_agent_id: "005"
    owner: adm.rahul
  - hostname: EB-MAIL01
    zone: dmz
    ip: 10.10.30.30
    os: Ubuntu
    os_version: "22.04"
    role: mail gateway
    services: [Postfix, content filter]
    wazuh_agent_id: "006"
    owner: adm.rahul

  # ── Security (collectors; never targets) ──────────
  - hostname: EB-WAZUH01
    zone: security
    ip: 10.10.40.10
    os: Ubuntu
    os_version: "22.04"
    role: Wazuh manager 4.x
    services: [wazuh-manager]
    wazuh_agent_id: "000"     # the manager's own built-in agent

