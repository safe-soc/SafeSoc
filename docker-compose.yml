services:
  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=safesoc
      - POSTGRES_USER=safesoc
      - POSTGRES_PASSWORD=safesoc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safesoc"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # The root .env configures all three app services identically — LLM
    # provider/model, TI provider keys (VT_API_KEY, ABUSEIPDB_API_KEY),
    # GROQ_API_KEY and TELEGRAM_* all come from there, so backend,
    # worker and beat can never disagree about which model is in use.
    # Compose otherwise reads .env only for ${} substitution, never into
    # the containers. required: false keeps a checkout with no .env
    # starting on code defaults.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Lets OLLAMA_HOST=host.docker.internal resolve on Linux too, where
      # Docker doesn't provide it by default.
      - "host.docker.internal:host-gateway"
    environment:
      # Container hostnames only: these MUST override .env's localhost
      # values, and anything listed here wins over env_file.
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=host.docker.internal
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The image's CMD runs `alembic upgrade head` before uvicorn, so this
    # passing means the schema is migrated too. python:3.12-slim has no
    # curl; /health answers 200 even when degraded, so any response counts.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    # The root .env configures all three app services identically — LLM
    # provider/model, TI provider keys (VT_API_KEY, ABUSEIPDB_API_KEY),
    # GROQ_API_KEY and TELEGRAM_* all come from there, so backend,
    # worker and beat can never disagree about which model is in use.
    # Compose otherwise reads .env only for ${} substitution, never into
    # the containers. required: false keeps a checkout with no .env
    # starting on code defaults.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Lets OLLAMA_HOST=host.docker.internal resolve on Linux too, where
      # Docker doesn't provide it by default.
      - "host.docker.internal:host-gateway"
    environment:
      # Container hostnames only: these MUST override .env's localhost
      # values, and anything listed here wins over env_file.
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=host.docker.internal
    volumes:
      - ./backend:/app
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the backend's migration rather than running one here:
      # concurrent `alembic upgrade` runs would race on the same schema.
      backend:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info
    # The root .env configures all three app services identically — LLM
    # provider/model, TI provider keys (VT_API_KEY, ABUSEIPDB_API_KEY),
    # GROQ_API_KEY and TELEGRAM_* all come from there, so backend,
    # worker and beat can never disagree about which model is in use.
    # Compose otherwise reads .env only for ${} substitution, never into
    # the containers. required: false keeps a checkout with no .env
    # starting on code defaults.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      # Lets OLLAMA_HOST=host.docker.internal resolve on Linux too, where
      # Docker doesn't provide it by default.
      - "host.docker.internal:host-gateway"
    environment:
      # Container hostnames only: these MUST override .env's localhost
      # values, and anything listed here wins over env_file.
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_HOST=host.docker.internal
    volumes:
      - ./backend:/app
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for the backend's migration rather than running one here:
      # concurrent `alembic upgrade` runs would race on the same schema.
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  opensearch-data:
  postgres-data:
  redis-data: