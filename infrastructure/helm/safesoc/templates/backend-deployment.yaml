apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "safesoc.fullname" . }}-backend
  labels:
    {{- include "safesoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "safesoc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "safesoc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "safesoc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            {{- include "safesoc.commonEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: {{ .Values.backend.probes.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.probes.timeoutSeconds }}
            failureThreshold: {{ .Values.backend.probes.failureThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
