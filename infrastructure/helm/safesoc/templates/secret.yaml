{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safesoc.secretName" . }}
  labels:
    {{- include "safesoc.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  jwt-secret: {{ include "safesoc.jwtSecret" . | quote }}
  groq-api-key: {{ .Values.secrets.groqApiKey | quote }}
  virustotal-api-key: {{ .Values.secrets.virustotalApiKey | quote }}
  abuseipdb-api-key: {{ .Values.secrets.abuseipdbApiKey | quote }}
  telegram-bot-token: {{ .Values.secrets.telegramBotToken | quote }}
  telegram-chat-id: {{ .Values.secrets.telegramChatId | quote }}
{{- end }}
