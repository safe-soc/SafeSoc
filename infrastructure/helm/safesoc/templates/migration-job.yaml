{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "safesoc.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "safesoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # Runs before backend/worker/beat roll out on both install and
    # upgrade — docker-compose.yml's own setup requires `alembic
    # upgrade head` as a manual step (backend/Dockerfile has no
    # migration-on-startup entrypoint); this Job automates it for a
    # chart rollout, which is a less hands-on operation.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "safesoc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "safesoc.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "safesoc.commonEnv" . | nindent 12 }}
{{- end }}
