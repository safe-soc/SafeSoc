{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "safesoc.fullname" . }}-postgresql
  labels:
    {{- include "safesoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "safesoc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
